# Blueprint Render — https://render.com/docs/blueprint-spec
# Déploie : API Node + base PostgreSQL managée + site statique (vitrine + LMS).

databases:
  - name: towerweb-db
    plan: free
    databaseName: tower_db
    user: tower

services:
  # ---- API ----
  - type: web
    name: towerweb-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run start:prod   # prisma migrate deploy && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: towerweb-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false        # renseigner avec l'URL du site statique
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: JITSI_APP_SECRET
        sync: false

  # ---- Front (vitrine + LMS) ----
  - type: web
    name: towerweb-front
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # ex: https://towerweb-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
