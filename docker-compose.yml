# Stack complète en local : PostgreSQL + migrations (service éphémère) + API + Front (nginx).
# Usage : docker compose up --build   puis   docker compose exec api npm run seed
#
# Fonctionne sans rien configurer (valeurs par défaut ci-dessous). Pour
# brancher Cloudinary/SMTP/Stripe en local, copier `.env.docker.example` en
# `.env` à la racine — docker compose le charge automatiquement.
# Un port déjà pris sur la machine hôte ? Surchargez DB_PORT / API_PORT / FRONT_PORT
# dans ce même `.env` plutôt que de modifier ce fichier.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: tower
      POSTGRES_DB: tower_db
    ports: ['${DB_PORT:-5432}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tower']
      interval: 10s
      timeout: 5s
      retries: 5

  # Conteneur éphémère : applique les migrations Prisma puis s'arrête (exit 0).
  # Construit depuis l'étape `deps` du même Dockerfile (CLI prisma inclus) —
  # l'image `api`, elle, ne l'embarque jamais (~200 Mo économisés, cf. Dockerfile).
  migrator:
    build:
      context: ./backend
      target: deps
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://tower:tower@db:5432/tower_db?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://tower:tower@db:5432/tower_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-min-32-characters-long-xx}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      NODE_ENV: production
      PORT: 5000
      # Optionnels — définis seulement si présents dans l'environnement/.env hôte
      # (sinon l'API bascule sur le stockage disque local et désactive l'envoi d'e-mails)
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ['${API_PORT:-5000}:5000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/api/health']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  front:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ['${FRONT_PORT:-8080}:80']

volumes:
  pgdata:
